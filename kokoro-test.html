<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kokoro voice test</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#111;--card:#f2f2f4;--line:#d0d0d5}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--card:#1d1d20;--line:#333}}
body{margin:0;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 8px}
label{display:block;margin:10px 0 4px;font-size:14px}
select,button{font:inherit;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:0 12px}
button{font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;min-height:160px;overflow-x:auto}
</style>
</head>
<body>
<h1>Kokoro voice test</h1>
<p>Runs the voice step by step and shows where it stops. Tap Run and wait. The page may freeze for a few seconds while it works.</p>
<label for="dtype">Precision</label>
<select id="dtype"><option>q8</option><option>q4</option><option>fp16</option><option>fp32</option></select>
<label for="device">Engine</label>
<select id="device"><option>wasm</option><option>webgpu</option></select>
<p><button id="run">Run test</button> <button id="copy">Copy log</button></p>
<pre id="log"></pre>
<script type="module">
const $ = id => document.getElementById(id), logEl = $('log'), t0 = performance.now();
const log = s => { logEl.textContent += '[' + ((performance.now() - t0) / 1000).toFixed(1) + 's] ' + s + '\n'; };
window.addEventListener('error', e => log('✗ error: ' + e.message));
window.addEventListener('unhandledrejection', e => log('✗ unhandled: ' + ((e.reason && e.reason.message) || e.reason)));
log('Browser: ' + navigator.userAgent);
log('WebAssembly: ' + typeof WebAssembly + ' | workers: ' + typeof Worker + ' | WebGPU: ' + (navigator.gpu ? 'yes' : 'no'));
log('Cross-origin isolated: ' + self.crossOriginIsolated + ' | memory (GB, approx): ' + (navigator.deviceMemory || '?') + ' | CPU threads: ' + (navigator.hardwareConcurrency || '?'));

const URLS = [
  'https://cdn.jsdelivr.net/npm/kokoro-js@1.2.0/+esm',
  'https://cdn.jsdelivr.net/npm/kokoro-js@1.2.0/dist/kokoro.web.js'
];
function wav(f32, sr) {
  const n = f32.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, f32[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Blob([buf], { type: 'audio/wav' });
}
const secs = t => ((performance.now() - t) / 1000).toFixed(1) + 's';

$('run').onclick = async () => {
  $('run').disabled = true;
  try {
    let mod = null;
    for (const u of URLS) {
      log('Loading library: ' + u);
      const s = performance.now();
      try {
        mod = await import(u);
        if (mod && mod.KokoroTTS) { log('✓ library loaded in ' + secs(s)); break; }
        log('✗ no KokoroTTS export; exports: ' + Object.keys(mod || {}).join(', '));
        mod = null;
      } catch (e) { log('✗ ' + ((e && e.message) || e)); }
    }
    if (!mod) throw new Error('the library did not load from either address');

    const dtype = $('dtype').value, device = $('device').value;
    log('Loading model (' + dtype + ', ' + device + ')…');
    const files = {}; let last = -10; const s1 = performance.now();
    const tts = await mod.KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', {
      dtype, device,
      progress_callback: p => {
        if (!p || p.status !== 'progress' || !p.file) return;
        files[p.file] = { l: p.loaded || 0, t: p.total || 0 };
        let l = 0, t = 0; for (const k in files) { l += files[k].l; t += files[k].t; }
        const pct = t ? Math.round(l / t * 100) : 0;
        if (pct >= last + 10) { last = pct; log('  download ' + pct + '% of ' + Math.round(t / 1048576) + ' MB'); }
      }
    });
    log('✓ model ready in ' + secs(s1));

    const s2 = performance.now();
    const out = await tts.generate('Hello. This is a test of the Kokoro voice.', { voice: 'af_heart', speed: 1 });
    const gen = (performance.now() - s2) / 1000;
    const samples = out.audio || out.data, sr = out.sampling_rate || 24000, dur = samples.length / sr;
    log('✓ generated ' + dur.toFixed(1) + 's of audio in ' + gen.toFixed(1) + 's (' + (dur / gen).toFixed(2) + 'x realtime; it needs to be above 1.0 to read smoothly)');

    const blob = typeof out.toBlob === 'function' ? out.toBlob() : wav(samples, sr);
    const a = new Audio(URL.createObjectURL(blob));
    a.onended = () => log('✓ playback finished');
    a.onerror = () => log('✗ the browser could not play the audio');
    await a.play();
    log('▶ playing…');
  } catch (e) { log('✗ STOPPED: ' + ((e && e.message) || e)); }
  $('run').disabled = false;
};
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(logEl.textContent); log('Log copied'); }
  catch (e) { const r = document.createRange(); r.selectNodeContents(logEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); log('Select and copy the log by hand'); }
};
</script>
</body>
</html>
